services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]

  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://redteam:redteam@postgres:5432/redteam
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_ROOT: /artifacts
    volumes:
      - redteam-artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  orchestrator:
    build: ./backend
    command: python -m app.orchestrator.worker
    environment:
      DATABASE_URL: postgresql+psycopg://redteam:redteam@postgres:5432/redteam
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_ROOT: /artifacts
      PROMPTFOO_COMMAND: ${PROMPTFOO_COMMAND:-}
      PYRIT_COMMAND: ${PYRIT_COMMAND:-}
      GARAK_COMMAND: ${GARAK_COMMAND:-}
      STRIKER_COMMAND: ${STRIKER_COMMAND:-}
    volumes:
      - redteam-artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redteam
      POSTGRES_USER: redteam
      POSTGRES_PASSWORD: redteam
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redteam -d redteam"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  sample-target:
    build: ./sample-target
    ports: ["9000:8000"]

volumes:
  postgres-data:
  redteam-artifacts:
